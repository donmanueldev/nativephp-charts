<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>NativePHP Charts: native charts for NativePHP Mobile on iOS and Android</title>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080808" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#080808" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#080808" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ED3F16" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ED3F16" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#080808"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative chart on the right -->
  <g transform="translate(720 150)">
    <path d="M0 300 L0 230 L80 190 L160 210 L240 120 L320 150 L400 40 L400 300 Z" fill="url(#area)"/>
    <path d="M0 230 L80 190 L160 210 L240 120 L320 150 L400 40" fill="none" stroke="#ED3F16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#080808" stroke="#ED3F16" stroke-width="5">
      <circle cx="0" cy="230" r="9"/>
      <circle cx="80" cy="190" r="9"/>
      <circle cx="160" cy="210" r="9"/>
      <circle cx="240" cy="120" r="9"/>
      <circle cx="320" cy="150" r="9"/>
      <circle cx="400" cy="40" r="9"/>
    </g>
  </g>
  <rect x="560" y="0" width="300" height="630" fill="url(#fade)"/>

  <!-- Mark and wordmark -->
  <g transform="translate(80 92) scale(1.05)" fill="#ED3F16">
    <path d="M8 84 50 18h8l4 12h5l11 19H65L52 64H38L18 84Z"/>
    <path d="m26 84 19-15h12l13-16 12 13-15 18Z"/>
    <path d="m74 84 14-22-15-26-4-6 4-12h8l39 66Z"/>
  </g>
  <text x="222" y="163" fill="#F0F6FC" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.2">NativePHP Charts</text>

  <!-- Tagline -->
  <text font-family="Helvetica, Arial, sans-serif" font-weight="700" fill="#FFFFFF" font-size="64" letter-spacing="-2">
    <tspan x="80" y="300">Native charts for</tspan>
    <tspan x="80" y="374">NativePHP Mobile</tspan>
  </text>
  <text x="80" y="436" fill="#CBD5E1" font-family="Helvetica, Arial, sans-serif" font-size="28">Swift Charts on iOS. Jetpack Compose on Android.</text>

  <!-- Chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#81E6D9">
    <rect x="80" y="490" width="196" height="48" rx="24" fill="none" stroke="#81E6D9" stroke-opacity="0.5" stroke-width="2"/>
    <text x="178" y="521" text-anchor="middle">10 chart types</text>
    <rect x="292" y="490" width="196" height="48" rx="24" fill="none" stroke="#81E6D9" stroke-opacity="0.5" stroke-width="2"/>
    <text x="390" y="521" text-anchor="middle">Blade or PHP</text>
    <rect x="504" y="490" width="160" height="48" rx="24" fill="none" stroke="#81E6D9" stroke-opacity="0.5" stroke-width="2"/>
    <text x="584" y="521" text-anchor="middle">No WebView</text>
  </g>
</svg>
