name: NativePHP Charts CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.4"
          - "8.5"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Resolve Composer dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHP tests
        run: composer test

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Validate nativephp.json
        run: php -r 'json_decode(file_get_contents("nativephp.json"), true, 512, JSON_THROW_ON_ERROR);'

      - name: Lint PHP sources and tests
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check whitespace errors
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD

  swift-syntax:
    name: Swift source syntax
    runs-on: macos-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse Swift sources
        run: find resources/ios/Sources -name '*.swift' -print0 | xargs -0 swiftc -parse
