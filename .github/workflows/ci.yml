name: NativePHP Charts CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.4"
          - "8.5"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Resolve Composer dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHP tests
        run: vendor/bin/pest --compact

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Validate NativePHP plugin
        run: vendor/bin/testbench native:plugin:validate . --no-interaction

      - name: Lint PHP sources and tests
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check whitespace errors
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD

  swift-native:
    name: Swift native tests
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse Swift sources
        run: find resources/ios/Sources -name '*.swift' -print0 | xargs -0 swiftc -parse

      - name: Compile Swift renderers and run native tests
        run: swift test

  android-native:
    name: Android native integration
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Create an ephemeral NativePHP app with this checkout
        env:
          COMPOSER_NO_INTERACTION: "1"
        run: |
          set -o pipefail
          fixture="$RUNNER_TEMP/nativephp-charts-android"
          : > "$GITHUB_WORKSPACE/android-native-build.log"
          composer create-project laravel/laravel "$fixture" --prefer-dist --no-progress
          cd "$fixture"
          composer config repositories.nativephp-charts path "$GITHUB_WORKSPACE"
          composer require nativephp/mobile:^4.0 nativephp/mobile-ui:^0.3 donmanueldev/nativephp-charts:*@dev --no-scripts --no-progress
          php artisan package:discover --ansi
          php artisan vendor:publish --tag=nativephp-plugins-provider --force --no-interaction
          php artisan native:plugin:register donmanueldev/nativephp-charts --force --no-interaction
          php artisan native:plugin:validate
          printf '\nNATIVEPHP_APP_ID=com.donmanueldev.nativephpchartsci\n' >> .env
          php artisan native:install android
          cd nativephp/android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/android-native-build.log"

      - name: Publish Android native build log
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: android-native-build-log
          path: android-native-build.log
          if-no-files-found: error
          retention-days: 14
